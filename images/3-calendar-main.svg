<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Team WBS</text>
  <rect x="200" y="12" width="90" height="26" fill="#fff" stroke="#666"/>
  <text x="245" y="30" font-size="13" text-anchor="middle" fill="#333">◀ 이전주</text>
  <text x="500" y="30" font-size="16" text-anchor="middle" fill="#222">2026년 8월</text>
  <rect x="710" y="12" width="90" height="26" fill="#fff" stroke="#666"/>
  <text x="755" y="30" font-size="13" text-anchor="middle" fill="#333">다음주 ▶</text>
  <rect x="880" y="12" width="100" height="26" fill="#fff" stroke="#666"/>
  <text x="930" y="30" font-size="13" text-anchor="middle" fill="#333">마이페이지 ▾</text>

  <!-- Weekday row -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="115" y="70">월</text>
    <text x="230" y="70">화</text>
    <text x="345" y="70">수</text>
    <text x="460" y="70">목</text>
    <text x="575" y="70">금</text>
    <text x="690" y="70">토</text>
    <text x="805" y="70">일</text>
  </g>
  <line x1="60" y1="80" x2="860" y2="80" stroke="#999"/>

  <!-- 5 week rows -->
  <!-- grid helper: rows at y=90,170,250,330,410, height=80 -->
  <g stroke="#ccc" fill="none">
    <rect x="60" y="90" width="800" height="80"/>
    <rect x="60" y="170" width="800" height="80"/>
    <rect x="60" y="250" width="800" height="80"/>
    <rect x="60" y="330" width="800" height="80"/>
    <rect x="60" y="410" width="800" height="80"/>
  </g>
  <g stroke="#ccc">
    <line x1="175" y1="90" x2="175" y2="490"/>
    <line x1="290" y1="90" x2="290" y2="490"/>
    <line x1="405" y1="90" x2="405" y2="490"/>
    <line x1="520" y1="90" x2="520" y2="490"/>
    <line x1="635" y1="90" x2="635" y2="490"/>
    <line x1="750" y1="90" x2="750" y2="490"/>
  </g>
  <g font-size="12" fill="#888">
    <text x="30" y="135">1주</text>
    <text x="30" y="215">2주</text>
    <text x="30" y="295">3주</text>
    <text x="30" y="375">4주</text>
    <text x="30" y="455">5주</text>
  </g>

  <!-- today highlight: week 3 (y=250-330), 화요일 column (175-290) -->
  <rect x="175" y="250" width="115" height="80" fill="#fff8e1" stroke="#e0a800" stroke-width="2"/>
  <text x="895" y="295" font-size="12" fill="#e0a800">← 오늘 포함 주(정중앙)</text>

  <!-- WBS bars in week 3 -->
  <rect x="180" y="262" width="220" height="18" fill="#c9c9c9" stroke="#888"/>
  <text x="290" y="275" font-size="11" text-anchor="middle" fill="#333">TODO (회색)</text>

  <rect x="290" y="288" width="220" height="18" fill="#8ecae6" stroke="#4d8fac"/>
  <text x="400" y="301" font-size="11" text-anchor="middle" fill="#123">진행중/QA (하늘색)</text>

  <rect x="410" y="314" width="150" height="18" fill="#95d5a2" stroke="#4c9a5b"/>
  <text x="485" y="327" font-size="11" text-anchor="middle" fill="#123">해결됨/완료 (초록색)</text>

  <!-- right detail panel placeholder -->
  <rect x="870" y="90" width="120" height="200" fill="#fafafa" stroke="#666" stroke-dasharray="4"/>
  <text x="930" y="115" font-size="12" text-anchor="middle" fill="#666">상세패널</text>
  <text x="930" y="132" font-size="10" text-anchor="middle" fill="#999">(드래그/클릭 시</text>
  <text x="930" y="146" font-size="10" text-anchor="middle" fill="#999">우측 노출)</text>

  <!-- bottom-right "내 WBS관리" button -->
  <rect x="850" y="500" width="140" height="36" fill="#333" />
  <text x="920" y="523" font-size="13" text-anchor="middle" fill="#fff">내 WBS관리 ▾</text>
</svg>
